<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>설중동행 雪中同行</title>
<meta name="description" content="한지 위 먹으로 그린 수묵화가 살아 움직이는 33초 웹 애니메이션. 눈길을 함께 걷는 호랑이와 나그네.">
<style>
:root{--paper:#ece4d2;--ink:#1f1c19;--bg:#d8cfbc}

:root[data-theme="dark"]{--bg:#1b1916}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:"Noto Serif KR","Nanum Myeongjo","Batang","AppleMyungjo",serif;color:var(--ink)}
#stage{position:relative;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;background:var(--paper);box-shadow:0 0 48px rgba(40,30,15,.28)}
#view{width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4em;background:var(--paper);transition:opacity 1.2s}
#ui.hide{opacity:0;pointer-events:none}
#ui h1{font-weight:400;letter-spacing:.6em;font-size:clamp(18px,3.2vw,42px);margin:0 0 .3em;writing-mode:vertical-rl;opacity:.82}
button{font:inherit;font-size:clamp(13px,1.3vw,17px);background:none;border:1px solid rgba(31,28,25,.45);padding:.55em 1.7em;letter-spacing:.25em;cursor:pointer;color:var(--ink);border-radius:2px}

button:disabled{opacity:.45;cursor:progress}
#ui small{font-size:clamp(11px,1vw,13px);opacity:.55;letter-spacing:.12em}
#again{position:absolute;right:2.4%;top:4%;opacity:0;transition:opacity 1.2s;pointer-events:none}
#again.show{opacity:.7;pointer-events:auto}
#err{position:absolute;inset:auto 0 8% 0;text-align:center;font-size:14px;opacity:.7}
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="ui"><h1>雪中同行</h1><button id="play" disabled>먹을 가는 중…</button><small>소리와 함께 · 33초</small></div>

  <div id="err"></div>
